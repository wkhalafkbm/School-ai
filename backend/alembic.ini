[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Deliberately empty: alembic/env.py resolves the URL from DATABASE_URL, then
# the repo's .env, so `alembic` and the app always target the same database.
# A value here would silently win over .env and migrate the wrong one.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
