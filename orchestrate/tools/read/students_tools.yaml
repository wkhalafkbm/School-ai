                $ref: '#/components/schemas/HTTPValidationError'
  /api/students/{student_id}/risk-summary:
    get:
      tags:
      - students
      summary: Get risk summary
      description: Returns a synthesised risk level (high/medium/low/none) and list
        of risk factors derived from LMS signals, support cases, and administrative
        holds.
      operationId: get_risk_summary_api_students__student_id__risk_summary_get
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      responses:
        '200':
          description: Successful Response
          content:
