                $ref: '#/components/schemas/HTTPValidationError'
  /api/students/{student_id}/matched-mentor:
    get:
      tags:
      - students
      summary: Get matched mentor
      description: Returns the single alumni mentor deterministically assigned
        to this student — the definitive mentor recommendation, not a list to
        choose from.
      operationId: get_student_matched_mentor_api_students__student_id__matched_mentor_get
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
